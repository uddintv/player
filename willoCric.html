<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Stream Player</title>
    <!-- Hls.js লাইব্রেরি সিডিএন -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
        }
        .video-container {
            width: 100vw;
            height: 100vh;
            position: relative;
          /*  background: radial-gradient(circle at center, #111 0%, #000 70%) !important; */
          
          
        }
        #videoPlayer {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }
                
        #loadingOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }                
        .loading-spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 4px solid white;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
                
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }



        #BufferingLoding {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
             background: transparent !important; /* background: rgba(0, 0, 0, 0.85);*/
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 14px; 
            font-weight: 700;
            font-family: sans-serif;
            z-index: 999;
            display: none; /* ডিফল্টভাবে লুকিয়ে রাখা হলো */
        }  
      
        #BufferingLoding #BufferingText {
            position: absolute; 
            top: 55%; 
            left: 50%; 
            transform: translate(-50%, -50%);
            color: #ffffff;
            font-size: 14px; 
            font-weight: 700;
            font-family: sans-serif;
            z-index: 9999;
            animation: blink 1s infinite; 
        }     

        #BufferingLoding .Buffering-spinner {
            width: 40px;
            height: 40px;
            border: 2px solid #1e293b;
            border-bottom: 2px solid #38bdf8;
            border-radius: 50%;
            animation: loaderSpin 0.8s linear infinite;
        }


        @keyframes loaderSpin {
            to {
                transform: rotate(360deg);
            }
        }

        
/*
        video::-webkit-media-controls-panel,
        video::-webkit-media-controls {
            background: transparent !important;
        }
      */
        video::-webkit-media-controls-overflow-button,
        video::-webkit-media-controls-fullscreen-button,
        video::-webkit-media-controls-current-time-display,
        video::-webkit-media-controls-time-remaining-display,
        video::-webkit-media-controls-timeline {
            display: none !important;
        }

        .refresh-btn {
            position: absolute;
            right: 5px;
            top: 5px;
            z-index: 9999;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .refresh-icon {
            width: 28px;
            height: 28px;
            fill: yellow;
            transition: transform 0.3s linear;
        }

        .refresh-btn.spin .refresh-icon {
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="video-container">
      
        <!-- Loading overlay  ==== লোডিং স্ক্রিন -->
        <div id="loadingOverlay">
            <div style="text-align: center;">
                <div class="loading-spinner" style="margin: 0 auto 20px;"></div>
                <p style="color: white; font-size: 14px; font-weight: 700;">Loading stream..</p>
            </div>
        </div>
      
        <!-- বাফারিং স্ক্রিন -->
        <div id="BufferingLoding">
            <div id="BufferingText">Buffering...</div>   
            <div class="Buffering-spinner"></div>
        </div>      
      
        <!-- ভিডিও প্লেয়ার -->
        <video id="videoPlayer" controls autoplay playsinline></video>
     
        <!-- 🔄 REFRESH বাটন -->
        <button class="refresh-btn" onclick="refreshVideo()">
            <svg class="refresh-icon" viewBox="0 0 24 24">
                <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"></path>
            </svg>  
        </button>   
    </div>

    <script>
        // URL থেকে ?id=getParameter বের করার ফাংশন
        function getUrlParameter(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }

        // ইউজার লিঙ্ক থেকে id বা চ্যানেল নাম ডায়নামিকভাবে নেওয়া (যেমন: ?id=WILLOWCRICKET)
        const channelId = getUrlParameter('id') || "WILLOWCRICKET";

        // কনফিগারেশন
        const config = {
            streamUrl: `https://blooming-anchorage-74937-01abcbf2453c.herokuapp.com/https://ds169.bluetier.top/${channelId}/index.m3u8?token=V0lMTE9XQ1JJQ0tFVHxub19jaGVja19pcHwxNzkzMDY4OTQ5.6970aa91ab120c6a6383b707ff3d8f49610fc3ed6c45b42ba98dcf62fe9af863`,
            channelSlug: channelId,
            tokenExpiresIn: 300,
            currentToken: "V0lMTE9XQ1JJQ0tFVHxub19jaGVja19pcHwxNzkzMDY4OTQ5.6970aa91ab120c6a6383b707ff3d8f49610fc3ed6c45b42ba98dcf62fe9af863"
        };
            
        let hls = null;
        let tokenRefreshTimer = null;
        const video = document.getElementById('videoPlayer');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const BufferingLoding = document.getElementById("BufferingLoding");
            
        // প্লেयर ইনিশিয়ালাইজ করা
        function initPlayer() {
            if (Hls.isSupported()) {
                hls = new Hls({
                    enableWorker: true,
                    lowLatencyMode: true,
                    backBufferLength: 90,
                    maxBufferLength: 30,
                    maxMaxBufferLength: 60,
                    maxBufferSize: 60 * 1000 * 1000,
                    maxBufferHole: 0.5,
                    highBufferWatchdogPeriod: 2,
                    nudgeOffset: 0.1,
                    nudgeMaxRetry: 3,
                    maxFragLookUpTolerance: 0.25,
                    liveSyncDurationCount: 3,
                    liveMaxLatencyDurationCount: 10,
                    liveDurationInfinity: true,
                    enableSoftwareAES: true
                });
                    
                hls.loadSource(config.streamUrl);
                hls.attachMedia(video);
                    
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    video.play().catch(e => console.log('Auto-play prevented:', e));
                    loadingOverlay.style.display = 'none';
                });
                    
                hls.on(Hls.Events.ERROR, function(event, data) {
                    if (data.fatal) {
                        switch(data.type) {
                            case Hls.ErrorTypes.NETWORK_ERROR:
                                hls.startLoad();
                                break;
                            case Hls.ErrorTypes.MEDIA_ERROR:
                                hls.recoverMediaError();
                                break;
                            default:
                                hls.destroy();
                                break;
                        }
                    }
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = config.streamUrl;
                video.addEventListener('loadedmetadata', function() {
                    loadingOverlay.style.display = 'none';
                });
            }
        }
            
        // টোকেন রিফ্রেশ সিস্টেম
        function scheduleTokenRefresh() {
            const refreshTime = (config.tokenExpiresIn - 30) * 1000;
            tokenRefreshTimer = setTimeout(async () => {
                await refreshToken();
            }, refreshTime);
        }
            
        async function refreshToken() {
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 4000);

                let response = await fetch(
                    'https://whispering-citadel-11540-0a9768b9a869.herokuapp.com/https://wideiptv.top/api/refresh_token.php',
                    {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            channel: config.channelSlug,
                            current_token: config.currentToken
                        }),
                        signal: controller.signal
                    }
                );
                clearTimeout(timeoutId);

                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();

                if (!data.success || !data.token) throw new Error('API নতুন টোকেন দেয়নি');

                const newToken = data.token;
                config.streamUrl = config.streamUrl.replace(
                    /([?&]token=)[^&]*/,
                    (_, prefix) => prefix + encodeURIComponent(newToken)
                );
                config.currentToken = newToken;
                config.tokenExpiresIn = Number(data.expires_in) || 300;
                return true;
            } catch (error) {
                console.error('Token refresh failed:', error);
                return false;
            }
        }

        window.addEventListener('DOMContentLoaded', async () => {
            await refreshToken();
            initPlayer();
            if (tokenRefreshTimer) clearTimeout(tokenRefreshTimer);
            scheduleTokenRefresh();
        });

        // বাফারিং ডিটেক্ট করা (Waiting & Playing ইভেন্ট)
        video.addEventListener("waiting", () => {
            BufferingLoding.style.display = "flex";
        });

        video.addEventListener("playing", () => {
            BufferingLoding.style.display = "none";
        });

        video.addEventListener("canplay", () => {
            BufferingLoding.style.display = "none";
        });

        // রিফ্রেশ ভিডিও ফাংশন ঠিক করা হয়েছে
        function refreshVideo() {
            const btn = document.querySelector(".refresh-btn");
            btn.classList.add("spin");
            
            loadingOverlay.style.display = 'flex';

            if (hls) {
                hls.destroy();
            }
            initPlayer();

            setTimeout(() => {
                btn.classList.remove("spin");
            }, 700);
        }

        window.addEventListener('beforeunload', () => {
            if (hls) hls.destroy();
            if (tokenRefreshTimer) clearTimeout(tokenRefreshTimer);
        });
    </script>
</body>
</html>
